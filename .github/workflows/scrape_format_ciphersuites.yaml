name: Scrape & Format Ciphersuites

on:
  workflow_dispatch:
    inputs:
      accept:
        # Comma-separated LIB:VER pairs whose baseline gates are bypassed for
        # this run only (e.g. "mbedtls:4.2,schannel:Windows Server 2025").
        description: "Accept gate failures for LIB:VER pairs (comma-separated)"
        required: false
        default: ""
      reason:
        # Required by ciphersuites-scrape whenever accept is set; recorded in
        # each accepted version's `accepted.reason` field in the data.
        description: "Evidence for the acceptance (required with accept)"
        required: false
        default: ""
      baseline_ref:
        # Git ref of THIS repo used as the validation baseline. Empty means
        # the checked-out HEAD (the normal case).
        description: "Baseline git ref (default: HEAD)"
        required: false
        default: ""
  schedule:
    - cron: "0 0 * * 0"

# Least privilege by default: no token scopes unless a job opts in.
permissions: {}

# Never let two scrapes race on the same branch.
concurrency:
  group: scrape-ciphersuites
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    # The only job; it needs write access solely to commit regenerated data.
    permissions:
      contents: write
    steps:
      # All actions pinned by commit SHA (supply-chain hardening).
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # Full history so --baseline-ref can resolve any earlier commit.
          fetch-depth: 0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      # Fetch cache: raw files are keyed by commit SHA, so reuse is safe and
      # cuts upstream load. Reference sources (IANA, Scanigma) are never cached.
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/python-ciphersuites
          key: scrape-cache-${{ runner.os }}

      # Install the scraper from an immutable release tag, never a branch.
      - name: Install python-ciphersuites
        run: python -m pip install "python-ciphersuites @ git+https://github.com/Spacecow99/python-ciphersuites@v0.1.0"

      - name: Scrape and validate
        id: scrape
        # Untrusted dispatch inputs reach the script ONLY via env vars and are
        # always quoted; never interpolate ${{ inputs.* }} into `run:`
        # (prevents script injection).
        env:
          ACCEPT: ${{ inputs.accept }}
          REASON: ${{ inputs.reason }}
          BASELINE_REF: ${{ inputs.baseline_ref }}
        run: |
          set +e
          args=(--out . --report validation-report.json)
          if [ -n "$ACCEPT" ]; then
            # Split on commas only, so labels containing spaces survive.
            IFS=',' read -ra pairs <<< "$ACCEPT"
            for pair in "${pairs[@]}"; do
              args+=(--accept "$pair")
            done
            args+=(--reason "$REASON")
          fi
          if [ -n "$BASELINE_REF" ]; then
            # The scraper rejects refs starting with '-' or containing ':' or
            # whitespace, so this cannot be read as a git option.
            args+=(--baseline-ref "$BASELINE_REF")
          fi
          ciphersuites-scrape "${args[@]}"
          echo "rc=$?" >> "$GITHUB_OUTPUT"

      # The scraper keeps failed versions as `stale` and always writes complete
      # files, so data is committed even when the run reports failures.
      - name: Commit regenerated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Only the data files; the report stays an artifact, not a commit.
          git add -- '*.yaml'
          if [ -n "$(git status --porcelain -- '*.yaml')" ]; then
            git commit -m "Updated data from job @ $(date -u)"
            git push
          fi

      - name: Upload validation report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: validation-report
          path: validation-report.json
          if-no-files-found: warn

      # Surface gate failures as a red run after data and report are saved.
      - name: Fail on validation failures
        if: steps.scrape.outputs.rc != '0'
        env:
          RC: ${{ steps.scrape.outputs.rc }}
        run: |
          echo "ciphersuites-scrape exited with $RC; see the job summary and validation-report artifact."
          exit 1
